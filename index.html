<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMS 雲端測驗與管理系統</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); margin: 0; padding: 20px; color: #334155; 
        }
        .container { max-width: 800px; margin: 0 auto; background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; font-size: 1.5rem; color: #0f172a; text-align: center; }

        .hidden { display: none !important; }
        .panel { background: #f1f5f9; padding: 16px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
        input[type="text"], input[type="password"], input[type="email"], textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; margin-bottom: 8px; box-sizing: border-box; }
        
        button { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
        button:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }

        /* 第三方登入按鈕 */
        .btn-provider {
            background: white; color: #374151; border: 1px solid #cbd5e1;
            padding: 12px 20px; font-size: 1rem; display: flex; align-items: center;
            justify-content: center; gap: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            margin-bottom: 10px; width: 100%; cursor: pointer; border-radius: 6px;
        }
        .btn-provider:hover { background: #f8fafc; }
        .btn-apple { background: #000; color: #fff; border: 1px solid #000; }
        .btn-apple:hover { background: #222; }

        .divider {
            display: flex; align-items: center; text-align: center; color: #94a3b8; margin: 15px 0; font-size: 0.85rem;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #cbd5e1; }
        .divider::before { margin-right: .75em; }
        .divider::after { margin-left: .75em; }

        .admin-tab { margin-top: 15px; padding: 15px; background: white; border-radius: 6px; border: 1px solid #e2e8f0; text-align: left; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; font-size: 0.9rem; }
        th { background: #f1f5f9; }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <h1>RMS 雲端測驗與管理系統</h1>

    <!-- 1. 登入面板 -->
    <div id="authPanel" class="panel">
        <p style="margin-bottom: 15px; color: #64748b;">請選擇登入方式以開始測驗</p>

        <button onclick="handleGoogleLogin()" class="btn-provider">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            使用 Google 帳號登入
        </button>

        <button onclick="handleAppleLogin()" class="btn-provider btn-apple">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 5.16c.55-.67.92-1.6.82-2.53-.82.03-1.82.55-2.41 1.22-.52.59-.98 1.54-.85 2.46.92.07 1.86-.48 2.44-1.15z"/>
            </svg>
            使用 Apple 帳號登入
        </button>

        <div class="divider">或使用電子郵件</div>

        <input type="email" id="authEmail" placeholder="電子郵件 (例如: admin@rms.com)">
        <input type="password" id="authPassword" placeholder="密碼">
        <div style="display: flex; gap: 10px; margin-top: 5px;">
            <button onclick="handleEmailLogin()">登入</button>
            <button onclick="handleEmailRegister()" class="btn-success">註冊帳號</button>
        </div>
    </div>

    <!-- 2. 主操作介面 -->
    <div id="mainPanel" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #e2e8f0; padding: 8px 12px; border-radius: 6px;">
            <span id="userDisplay">使用者</span>
            <button onclick="handleLogout()" class="btn-danger" style="width: auto; padding: 4px 10px;">登出</button>
        </div>

        <div class="panel" style="text-align: left;">
            <div class="input-group">
                <input type="text" id="bankCode" placeholder="輸入題庫代碼">
                <button onclick="fetchFirebaseBank()" style="width: auto;">開始測驗</button>
            </div>
            <button onclick="loadOpenBanks()">瀏覽站內開放題庫</button>
        </div>

        <!-- 管理員控制台 -->
        <div id="adminPanel" class="panel hidden" style="border: 2px dashed #eab308; text-align: left;">
            <h3 style="margin-top:0; color:#b45309;">👑 管理員控制台</h3>
            <div style="display:flex; gap:5px; flex-wrap:wrap;">
                <button onclick="showTab('tab1')" style="width:auto;">JSON 建立</button>
                <button onclick="showTab('tab2')" style="width:auto;" class="btn-success">表單建立</button>
                <button onclick="showTab('tab3')" style="width:auto;">查看成績</button>
                <button onclick="showTab('tab4')" style="width:auto;" class="btn-danger">用戶停權</button>
                <button onclick="showTab('tab5')" style="width:auto;">發送公告</button>
            </div>

            <div id="tab1" class="admin-tab hidden">
                <h4>JSON 代碼建立題庫</h4>
                <input type="text" id="newBankCode" placeholder="自訂題庫代碼">
                <textarea id="jsonInput" style="height:100px;" placeholder='{"title":"考試名稱","questions":[]}'></textarea>
                <button onclick="uploadNewBank()">上傳 JSON 題庫</button>
            </div>

            <div id="tab2" class="admin-tab hidden">
                <h4>表單式創建題庫</h4>
                <input id="formBankCode" placeholder="題庫代碼">
                <input id="formBankTitle" placeholder="考試名稱">
                <div id="questionFormArea"></div>
                <button onclick="addQuestionField()" style="background:#475569;">+ 新增題目欄位</button>
                <button onclick="saveFormBank()" class="btn-success">儲存並發布表單題庫</button>
            </div>

            <div id="tab3" class="admin-tab hidden">
                <h4>考生歷次成績紀錄</h4>
                <button onclick="loadExamResults()" style="width:auto;">重新整理成績表</button>
                <div id="resultsTable"></div>
            </div>

            <div id="tab4" class="admin-tab hidden">
                <h4>用戶停權管理</h4>
                <input id="targetEmail" placeholder="輸入要停權的 Email">
                <button onclick="suspendUser()" class="btn-danger">執行停權</button>
            </div>

            <div id="tab5" class="admin-tab hidden">
                <h4>發送公告/個別通知</h4>
                <input id="annTitle" placeholder="公告標題">
                <textarea id="annContent" placeholder="公告內容"></textarea>
                <button onclick="sendAnnouncement()">發送公告</button>
            </div>
        </div>

        <div id="quizContainer"></div>
        <div id="announcementArea" class="panel" style="text-align: left;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, OAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAdyumqIGFQNJYnlhEUGe_b7NMSdBQNsMA",
        authDomain: "rms-quiz-system-dbserver.firebaseapp.com",
        databaseURL: "https://rms-quiz-system-dbserver-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "rms-quiz-system-dbserver",
        storageBucket: "rms-quiz-system-dbserver.firebasestorage.app",
        messagingSenderId: "769519554299",
        appId: "1:769519554299:web:fcb6e641fb77dacffc2a5e",
        measurementId: "G-939JE1X57X"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();
    const appleProvider = new OAuthProvider('apple.com');

    window.handleGoogleLogin = () => signInWithPopup(auth, googleProvider);
    window.handleAppleLogin = () => signInWithPopup(auth, appleProvider);
    window.handleEmailLogin = () => signInWithEmailAndPassword(auth, document.getElementById('authEmail').value, document.getElementById('authPassword').value);
    window.handleEmailRegister = () => createUserWithEmailAndPassword(auth, document.getElementById('authEmail').value, document.getElementById('authPassword').value);
    window.handleLogout = () => signOut(auth);
    window.showTab = (id) => { document.querySelectorAll('.admin-tab').forEach(t=>t.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('authPanel').classList.add('hidden');
            document.getElementById('mainPanel').classList.remove('hidden');
            document.getElementById('userDisplay').innerText = `使用者：${user.displayName || user.email}`;
            if (user.email === "admin@rms.com") document.getElementById('adminPanel').classList.remove('hidden');
            
            // 載入公告
            try {
                const snap = await getDocs(collection(db, "announcements"));
                let annHtml = "<h4>📢 系統公告：</h4>";
                snap.forEach(d => annHtml += `<p><b>${d.data().title}</b>: ${d.data().content}</p>`);
                document.getElementById('announcementArea').innerHTML = annHtml;
            } catch(e) { console.error(e); }
        } else {
            document.getElementById('authPanel').classList.remove('hidden');
            document.getElementById('mainPanel').classList.add('hidden');
        }
    });

    // 管理員功能：JSON 上傳
    window.uploadNewBank = async () => {
        const code = document.getElementById('newBankCode').value.trim();
        const data = JSON.parse(document.getElementById('jsonInput').value);
        if(!code) return alert("請輸入代碼");
        await setDoc(doc(db, "banks", code), data);
        alert("JSON 題庫建立成功！");
    };

    // 管理員功能：表單建題庫
    window.addQuestionField = () => {
        const div = document.createElement('div');
        div.style.cssText = "background:#f8fafc; padding:10px; margin-bottom:8px; border-radius:6px; border:1px solid #cbd5e1;";
        div.innerHTML = `
            <input class="q-text" placeholder="輸入題目">
            <input class="q-opt" placeholder="選項 (請用逗號隔開，例: A,B,C,D)">
            <input class="q-ans" placeholder="正確答案索引 (第一選項填 0)">
        `;
        document.getElementById('questionFormArea').appendChild(div);
    };

    window.saveFormBank = async () => {
        const code = document.getElementById('formBankCode').value.trim();
        const title = document.getElementById('formBankTitle').value.trim();
        if(!code || !title) return alert("請填寫題庫代碼與考試名稱");
        
        const questions = Array.from(document.querySelectorAll('#questionFormArea > div')).map(d => ({
            q: d.querySelector('.q-text').value,
            options: d.querySelector('.q-opt').value.split(',').map(s => s.trim()),
            ans: parseInt(d.querySelector('.q-ans').value)
        }));

        await setDoc(doc(db, "banks", code), { title, questions });
        alert("表單題庫已成功儲存！");
    };

    // 查看考試成績
    window.loadExamResults = async () => {
        const snap = await getDocs(collection(db, "quiz_results"));
        let html = "<table><tr><th>考生</th><th>考試名稱</th><th>分數</th></tr>";
        snap.forEach(d => {
            const data = d.data();
            html += `<tr><td>${data.userEmail}</td><td>${data.bankTitle || '未命名'}</td><td>${data.score} 分</td></tr>`;
        });
        document.getElementById('resultsTable').innerHTML = html + "</table>";
    };

    // 停權用戶
    window.suspendUser = async () => {
        const email = document.getElementById('targetEmail').value.trim();
        if(!email) return alert("請輸入信箱");
        await setDoc(doc(db, "users", email), { suspended: true }, { merge: true });
        alert(email + " 已被停權");
    };

    // 發送公告
    window.sendAnnouncement = async () => {
        const title = document.getElementById('annTitle').value.trim();
        const content = document.getElementById('annContent').value.trim();
        if(!title || !content) return alert("請填寫標題與內容");
        await addDoc(collection(db, "announcements"), { title, content, timestamp: serverTimestamp() });
        alert("公告已成功發送！");
    };

    // 瀏覽開放題庫
    window.loadOpenBanks = async () => {
        const snap = await getDocs(collection(db, "banks"));
        let html = "<h4>📋 站內開放題庫清單：</h4>";
        snap.forEach(d => {
            html += `<div style="background:white; padding:8px; margin-bottom:5px; border-radius:4px; border:1px solid #cbd5e1;"><b>${d.data().title}</b> (代碼: <code>${d.id}</code>)</div>`;
        });
        document.getElementById('quizContainer').innerHTML = html;
    };
</script>
</body>
</html>
