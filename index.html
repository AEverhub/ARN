<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMS 雲端題庫測驗系統</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #334155; }
        .container { max-width: 700px; margin: 0 auto; background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; font-size: 1.5rem; color: #0f172a; text-align: center; }

        /* 控制面板 */
        .control-panel { background: #f1f5f9; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        .options-group { display: flex; gap: 15px; align-items: center; font-size: 0.9rem; flex-wrap: wrap; }
        
        button { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button:hover { opacity: 0.9; }

        /* 計時與狀態列 */
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #eff6ff; border-radius: 6px; margin-bottom: 15px; font-weight: bold; }
        .timer { color: #b91c1c; }

        /* 題目卡片 */
        .q-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
        .q-title { font-weight: 600; margin-bottom: 12px; }
        .option-label { display: block; padding: 10px 12px; background: white; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .option-label:hover { background: #eff6ff; }
        
        /* 檢討樣式 */
        .correct-opt { background: #dcfce7 !important; border-color: var(--success) !important; color: #14532d; font-weight: bold; }
        .wrong-opt { background: #fee2e2 !important; border-color: var(--danger) !important; color: #7f1d1d; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; margin-left: 8px; }
        .badge-success { background: #22c55e; color: white; }
        .badge-danger { background: #ef4444; color: white; }

        /* 成績單 */
        .result-box { text-align: center; padding: 20px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; margin-top: 20px; display: none; }
        .score { font-size: 2.2rem; font-weight: bold; color: #047857; margin: 10px 0; }
        .btn-submit { width: 100%; background: var(--success); font-size: 1.1rem; padding: 12px; }
        
        /* 雲端同步狀態 */
        .sync-status { font-size: 0.8rem; color: #0284c7; text-align: right; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>RMS 雲端題庫測驗系統</h1>

    <!-- 設定與載入區 -->
    <div class="control-panel">
        <div class="input-group">
            <input type="text" id="bankCode" placeholder="輸入 Firebase 題庫代碼 (例如: 001)">
            <button onclick="fetchFirebaseBank()">從雲端載入題庫</button>
        </div>
        <div class="options-group">
            <label><input type="checkbox" id="chkShuffle"> 隨機洗牌題目與選項</label>
            <label><input type="checkbox" id="chkTimer"> 啟用限時 (每題 1 分鐘)</label>
        </div>
        <div id="syncStatus" class="sync-status">Firebase 狀態：等待連線...</div>
    </div>

    <!-- 計時與資訊列 -->
    <div id="statusBar" class="status-bar" style="display:none;">
        <span id="bankTitleDisplay">題庫名稱</span>
        <span class="timer" id="timerDisplay">剩餘時間: --:--</span>
    </div>

    <!-- 題目區域 -->
    <div id="quizContainer"></div>

    <!-- 結算面板 -->
    <div id="resultBox" class="result-box">
        <h2>測驗完成！成績已同步至雲端</h2>
        <div class="score" id="scoreText">0 / 0</div>
        <p id="timeUsedText"></p>
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})">查看下方詳細答題檢討</button>
    </div>
</div>

<!-- Firebase SDK (ES Module) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, addDate, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 💡 請替換成你專案的 Firebase 設定
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    document.getElementById('syncStatus').innerText = "Firebase 狀態：已連線成功";

    let currentQuestions = [];
    let originalData = null;
    let timerInterval = null;
    let secondsLeft = 0;
    let activeBankCode = "";

    // 綁定到全域以便 HTML 按鈕呼叫
    window.fetchFirebaseBank = async function() {
        const code = document.getElementById('bankCode').value.trim();
        if (!code) return alert('請輸入題庫代碼');
        activeBankCode = code;

        try {
            document.getElementById('syncStatus').innerText = "Firebase 狀態：正在讀取雲端題庫...";
            
            // 從 Firestore 的 "banks" 集合中抓取對應代碼的文件
            const docRef = doc(db, "banks", code);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                originalData = docSnap.data();
                document.getElementById('syncStatus').innerText = `Firebase 狀態：成功載入題庫 [${originalData.title}]`;
                initQuiz();
            } else {
                alert(`雲端找不到代碼為 "${code}" 的題庫`);
                document.getElementById('syncStatus').innerText = "Firebase 狀態：查無此題庫";
            }
        } catch (error) {
            console.error("讀取錯誤：", error);
            alert("讀取雲端題庫失敗，請檢查網路或 Firebase 權限設定。");
            document.getElementById('syncStatus').innerText = "Firebase 狀態：讀取失敗";
        }
    };

    // 初始化測驗資料
    function initQuiz() {
        clearInterval(timerInterval);
        currentQuestions = JSON.parse(JSON.stringify(originalData.questions));

        const shouldShuffle = document.getElementById('chkShuffle').checked;
        const useTimer = document.getElementById('chkTimer').checked;

        if (shouldShuffle) {
            currentQuestions.sort(() => Math.random() - 0.5);
            currentQuestions.forEach(q => {
                const originalAnsText = q.options[q.ans];
                q.options.sort(() => Math.random() - 0.5);
                q.ans = q.options.indexOf(originalAnsText);
            });
        }

        if (useTimer) {
            secondsLeft = currentQuestions.length * 60;
            document.getElementById('timerDisplay').style.display = 'inline';
            startTimer();
        } else {
            document.getElementById('timerDisplay').style.display = 'none';
        }

        document.getElementById('bankTitleDisplay').innerText = originalData.title;
        document.getElementById('statusBar').style.display = 'flex';
        document.getElementById('resultBox').style.display = 'none';

        renderQuiz();
    }

    function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            secondsLeft--;
            updateTimerDisplay();
            if (secondsLeft <= 0) {
                clearInterval(timerInterval);
                alert('時間到！系統已自動提交試卷。');
                window.calculateScore();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(secondsLeft / 60);
        const secs = secondsLeft % 60;
        document.getElementById('timerDisplay').innerText = `剩餘時間: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        let html = `<form id="quizForm">`;

        currentQuestions.forEach((q, qIdx) => {
            html += `
                <div class="q-card" id="qCard_${qIdx}">
                    <div class="q-title">${qIdx + 1}. ${q.q} <span id="badge_${qIdx}"></span></div>
                    ${q.options.map((opt, oIdx) => `
                        <label class="option-label" id="optLabel_${qIdx}_${oIdx}">
                            <input type="radio" name="q_${qIdx}" value="${oIdx}"> ${opt}
                        </label>
                    `).join('')}
                </div>
            `;
        });

        html += `<button type="button" class="btn-submit" onclick="window.calculateScore()">提交試卷並同步至雲端</button></form>`;
        container.innerHTML = html;
    }

    // 計算分數並寫入 Firestore 紀錄
    window.calculateScore = async function() {
        clearInterval(timerInterval);
        let score = 0;
        const form = document.getElementById('quizForm');

        currentQuestions.forEach((q, qIdx) => {
            const selectedVal = form[`q_${qIdx}`]?.value;
            const selectedOpt = selectedVal !== undefined ? parseInt(selectedVal) : -1;
            const badgeEl = document.getElementById(`badge_${qIdx}`);

            const inputs = document.getElementsByName(`q_${qIdx}`);
            inputs.forEach(i => i.disabled = true);

            document.getElementById(`optLabel_${qIdx}_${q.ans}`).classList.add('correct-opt');

            if (selectedOpt === q.ans) {
                score++;
                badgeEl.innerHTML = `<span class="badge badge-success">答對</span>`;
            } else {
                badgeEl.innerHTML = `<span class="badge badge-danger">答錯</span>`;
                if (selectedOpt !== -1) {
                    document.getElementById(`optLabel_${qIdx}_${selectedOpt}`).classList.add('wrong-opt');
                }
            }
        });

        const total = currentQuestions.length;
        const finalScore = Math.round((score / total) * 100);
        
        document.getElementById('scoreText').innerText = `${score} / ${total} 題 (${finalScore}分)`;
        document.getElementById('resultBox').style.display = 'block';

        // 將成績寫入雲端 Firestore 的 "quiz_results" 集合
        try {
            await addDoc(collection(db, "quiz_results"), {
                bankCode: activeBankCode,
                bankTitle: originalData.title,
                score: finalScore,
                correctCount: score,
                totalQuestions: total,
                timestamp: serverTimestamp()
            });
            document.getElementById('syncStatus').innerText = "Firebase 狀態：成績已成功上傳至雲端紀錄";
        } catch (e) {
            console.error("寫入成績錯誤：", e);
        }

        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    };
</script>

</body>
</html>
