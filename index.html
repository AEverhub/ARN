<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>RMS 雲端測驗與管理系統</title>
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --bg: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .panel { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin: 5px 0; width: 100%; }
        .btn-provider { background: white; color: #333; border: 1px solid #ccc; margin-bottom: 5px; }
        .admin-tab { margin-top: 10px; padding: 10px; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <h1>RMS 雲端測驗系統</h1>
    
    <!-- 登入區 (包含快捷登入) -->
    <div id="authPanel">
        <button class="btn-provider" onclick="handleGoogleLogin()">使用 Google 登入</button>
        <button class="btn-provider" onclick="handleAppleLogin()">使用 Apple 登入</button>
        <hr>
        <input type="email" id="authEmail" placeholder="Email">
        <input type="password" id="authPassword" placeholder="密碼">
        <button onclick="handleEmailLogin()">登入</button>
        <button onclick="handleEmailRegister()" class="btn-success">註冊帳號</button>
    </div>

    <!-- 主系統區 -->
    <div id="mainPanel" class="hidden">
        <p>歡迎：<span id="userEmailDisplay"></span> <button onclick="handleLogout()" class="btn-danger">登出</button></p>
        
        <div class="panel">
            <h3>測驗入口</h3>
            <input type="text" id="bankCode" placeholder="輸入題庫代碼">
            <button onclick="fetchFirebaseBank()">開始測驗</button>
            <button onclick="loadOpenBanks()">瀏覽開放題庫</button>
        </div>

        <!-- 管理員控制台 -->
        <div id="adminPanel" class="panel hidden" style="border: 2px dashed #eab308;">
            <h3>👑 管理員控制台</h3>
            <button onclick="showTab('tab1')">JSON 建立題庫</button>
            <button onclick="showTab('tab2')">查看考生紀錄</button>
            <button onclick="showTab('tab3')">用戶停權</button>
            <button onclick="showTab('tab4')">發送公告</button>

            <div id="tab1" class="admin-tab hidden">
                <input type="text" id="newBankCode" placeholder="題庫代碼">
                <textarea id="jsonInput" placeholder='JSON: {"title":"考試名稱", "questions":[]}'></textarea>
                <button onclick="uploadNewBank()" class="btn-success">上傳題庫</button>
            </div>
            <div id="tab2" class="admin-tab hidden"><div id="resultsTable"></div></div>
            <div id="tab3" class="admin-tab hidden"><input id="targetEmail" placeholder="Email"><button onclick="suspendUser()" class="btn-danger">執行停權</button></div>
            <div id="tab4" class="admin-tab hidden"><input id="annTitle" placeholder="標題"><textarea id="annContent" placeholder="內容"></textarea><button onclick="sendAnnouncement()">發送公告</button></div>
        </div>
        
        <div id="quizContainer"></div>
        <div id="announcementArea" class="panel"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, OAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    // --- 請在此處填入你的 Firebase 設定 ---
    const firebaseConfig = { 
        // 記得貼回你截圖裡的那一段配置
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();
    const appleProvider = new OAuthProvider('apple.com');

    // 登入方法
    window.handleGoogleLogin = () => signInWithPopup(auth, googleProvider);
    window.handleAppleLogin = () => signInWithPopup(auth, appleProvider);
    window.handleEmailLogin = () => signInWithEmailAndPassword(auth, document.getElementById('authEmail').value, document.getElementById('authPassword').value);
    window.handleEmailRegister = () => createUserWithEmailAndPassword(auth, document.getElementById('authEmail').value, document.getElementById('authPassword').value);
    window.handleLogout = () => signOut(auth);
    window.showTab = (id) => { document.querySelectorAll('.admin-tab').forEach(t=>t.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('authPanel').classList.add('hidden');
            document.getElementById('mainPanel').classList.remove('hidden');
            document.getElementById('userEmailDisplay').innerText = user.email;
            if (user.email === "admin@rms.com") document.getElementById('adminPanel').classList.remove('hidden');
        } else {
            document.getElementById('authPanel').classList.remove('hidden');
            document.getElementById('mainPanel').classList.add('hidden');
        }
    });

    // 管理員功能
    window.uploadNewBank = async () => {
        const code = document.getElementById('newBankCode').value;
        const data = JSON.parse(document.getElementById('jsonInput').value);
        await setDoc(doc(db, "banks", code), data);
        alert("題庫已建立");
    };

    window.sendAnnouncement = async () => {
        await addDoc(collection(db, "announcements"), { title: document.getElementById('annTitle').value, content: document.getElementById('annContent').value });
        alert("公告已發送");
    };

    window.suspendUser = async () => {
        await setDoc(doc(db, "users", document.getElementById('targetEmail').value), { suspended: true }, { merge: true });
        alert("已停權");
    };

    window.loadOpenBanks = async () => {
        const snap = await getDocs(collection(db, "banks"));
        let html = "<h4>開放題庫：</h4>";
        snap.forEach(d => html += `<div>${d.data().title} (代碼: ${d.id})</div>`);
        document.getElementById('quizContainer').innerHTML = html;
    };
</script>
</body>
</html>
