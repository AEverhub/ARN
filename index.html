<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>雲端測驗與管理系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --bg: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .panel { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin: 5px 0; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <h1>RMS 雲端測驗系統</h1>
    
    <!-- 登入區 -->
    <div id="authPanel">
        <input type="email" id="authEmail" placeholder="Email">
        <input type="password" id="authPassword" placeholder="密碼">
        <button onclick="handleEmailLogin()">登入</button>
        <button onclick="handleEmailRegister()" class="btn-success">註冊</button>
    </div>

    <!-- 主選單 -->
    <div id="mainPanel" class="hidden">
        <div class="user-info-bar">歡迎：<span id="userEmailDisplay"></span> <button onclick="handleLogout()">登出</button></div>
        
        <div class="panel">
            <h3>測驗入口</h3>
            <input type="text" id="bankCode" placeholder="輸入題庫代碼">
            <button onclick="fetchFirebaseBank()">開始測驗</button>
            <button onclick="loadOpenBanks()">瀏覽開放題庫</button>
        </div>

        <!-- 管理員控制台 -->
        <div id="adminPanel" class="panel hidden" style="border: 2px dashed #eab308;">
            <h3>管理員控制台</h3>
            <button onclick="showTab('tab1')">JSON 建立</button>
            <button onclick="showTab('tab2')">成績查看</button>
            <button onclick="showTab('tab3')">用戶停權</button>
            <button onclick="showTab('tab4')">公告通知</button>
            <button onclick="showTab('tab5')">表單建立</button>

            <div id="tab1" class="admin-tab hidden">
                <input type="text" id="newBankCode" placeholder="代碼">
                <textarea id="jsonInput" placeholder='JSON: {"title":"考試名稱", "questions":[]}'></textarea>
                <button onclick="uploadNewBank()">上傳 JSON</button>
            </div>
            <div id="tab2" class="admin-tab hidden"><button onclick="loadExamResults()">重新整理</button><div id="resultsTable"></div></div>
            <div id="tab3" class="admin-tab hidden"><input id="targetEmail" placeholder="Email"><button onclick="suspendUser()" class="btn-danger">停權該用戶</button></div>
            <div id="tab4" class="admin-tab hidden"><input id="annTitle" placeholder="標題"><textarea id="annContent" placeholder="內容"></textarea><button onclick="sendAnnouncement()">發送公告</button></div>
            <div id="tab5" class="admin-tab hidden">
                <input id="formBankCode" placeholder="代碼"><input id="formBankTitle" placeholder="考試名稱">
                <div id="questionFormArea"></div><button onclick="addQuestionField()">+ 新增題目</button><button onclick="saveFormBank()" class="btn-success">儲存表單題庫</button>
            </div>
        </div>
        
        <div id="quizContainer"></div>
        <div id="announcementArea" class="panel"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, addDoc, getDocs, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = { /* 請填入你的 Firebase 設定 */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 基礎功能
    window.handleEmailLogin = () => signInWithEmailAndPassword(auth, document.getElementById('authEmail').value, document.getElementById('authPassword').value);
    window.handleEmailRegister = () => createUserWithEmailAndPassword(auth, document.getElementById('authEmail').value, document.getElementById('authPassword').value);
    window.handleLogout = () => signOut(auth);
    window.showTab = (id) => { document.querySelectorAll('.admin-tab').forEach(t=>t.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('authPanel').classList.add('hidden');
            document.getElementById('mainPanel').classList.remove('hidden');
            document.getElementById('userEmailDisplay').innerText = user.email;
            if (user.email === "admin@rms.com") document.getElementById('adminPanel').classList.remove('hidden');
            // 載入公告
            const snap = await getDocs(collection(db, "announcements"));
            snap.forEach(d => document.getElementById('announcementArea').innerHTML += `<div><b>${d.data().title}</b>: ${d.data().content}</div>`);
        } else {
            document.getElementById('authPanel').classList.remove('hidden');
            document.getElementById('mainPanel').classList.add('hidden');
        }
    });

    // 題庫/管理功能實作
    window.addQuestionField = () => {
        const div = document.createElement('div');
        div.innerHTML = `<input class="q-text" placeholder="題目"><input class="q-opt" placeholder="選項(逗號隔開)"><input class="q-ans" placeholder="答案索引(0-3)">`;
        document.getElementById('questionFormArea').appendChild(div);
    };

    window.saveFormBank = async () => {
        const questions = Array.from(document.querySelectorAll('#questionFormArea > div')).map(d => ({
            q: d.querySelector('.q-text').value,
            options: d.querySelector('.q-opt').value.split(','),
            ans: parseInt(d.querySelector('.q-ans').value)
        }));
        await setDoc(doc(db, "banks", document.getElementById('formBankCode').value), { title: document.getElementById('formBankTitle').value, questions });
        alert("題庫建立完成");
    };

    window.loadOpenBanks = async () => {
        const snap = await getDocs(collection(db, "banks"));
        let html = "<h4>開放題庫清單：</h4>";
        snap.forEach(d => html += `<div class="panel"><b>${d.data().title}</b> (代碼: ${d.id})</div>`);
        document.getElementById('quizContainer').innerHTML = html;
    };

    window.sendAnnouncement = async () => {
        await addDoc(collection(db, "announcements"), { title: document.getElementById('annTitle').value, content: document.getElementById('annContent').value, timestamp: serverTimestamp() });
        alert("公告已發送");
    };

    window.loadExamResults = async () => {
        const snap = await getDocs(collection(db, "quiz_results"));
        let html = "<table><tr><th>考生</th><th>考試名稱</th><th>成績</th></tr>";
        snap.forEach(d => html += `<tr><td>${d.data().userEmail}</td><td>${d.data().bankTitle}</td><td>${d.data().score}</td></tr>`);
        document.getElementById('resultsTable').innerHTML = html + "</table>";
    };

    window.suspendUser = async () => {
        await setDoc(doc(db, "users", document.getElementById('targetEmail').value), { suspended: true }, { merge: true });
        alert("該用戶已被停權");
    };
</script>
</body>
</html>
